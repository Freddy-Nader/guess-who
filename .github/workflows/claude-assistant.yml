name: Claude Assistant

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    if: |
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Call Claude via GitHub Models and post reply
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const https = require('https');

            const isPR        = !!context.payload.issue.pull_request;
            const issueTitle  = context.payload.issue.title;
            const issueBody   = context.payload.issue.body || '';
            const commentBody = context.payload.comment.body;

            const requestBody = JSON.stringify({
              model: 'gpt-4o',
              max_tokens: 2048,
              messages: [
                {
                  role: 'system',
                  content: 'You are a helpful assistant in a GitHub issue/PR tracker. The user mentioned @claude in a comment. Be concise and actionable. Use GitHub-flavored markdown.',
                },
                {
                  role: 'user',
                  content: [
                    `GitHub ${isPR ? 'Pull Request' : 'Issue'}: ${issueTitle}`,
                    '',
                    'Body:',
                    issueBody,
                    '',
                    'User comment (they mentioned @claude):',
                    commentBody,
                  ].join('\n'),
                },
              ],
            });

            const responseText = await new Promise((resolve, reject) => {
              const req = https.request({
                hostname: 'models.inference.ai.azure.com',
                path: '/chat/completions',
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.GH_TOKEN}`,
                  'content-type': 'application/json',
                  'content-length': Buffer.byteLength(requestBody),
                },
              }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(data));
              });
              req.on('error', reject);
              req.write(requestBody);
              req.end();
            });

            const parsed = JSON.parse(responseText);
            if (parsed.error) throw new Error(JSON.stringify(parsed.error));

            const reply = parsed.choices[0].message.content;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `> 🤖 **GPT-4o** (via GitHub Models)\n\n${reply}`,
            });
